title: PentAGI Agent Command Wrapper
id: eb9c13d9-3bf1-59c9-9201-c1a85e1bd94c
status: experimental
description: |
    Detects the shell wrapper PentAGI puts around every agent command in its Kali worker container: it ignores hangups,
    raises the process's oom_score_adj by one to mark the flow, then runs the command with exec sh -c "$0".
references:
    - https://github.com/vxcontrol/pentagi
    - https://github.com/ThreatDefence/AOF_attack_detections
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        CommandLine|contains|all:
            - 'trap "" HUP'
            - '/proc/self/oom_score_adj'
            - 'exec sh -c "$0"'
    condition: selection
falsepositives:
    - Authorized red team use of PentAGI
level: high
