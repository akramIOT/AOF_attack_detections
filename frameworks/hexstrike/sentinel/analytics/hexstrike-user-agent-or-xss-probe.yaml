id: 82566f52-71a1-5349-8b36-53fa03bf5c67
name: HexStrike user agent or cross-site scripting probe
description: |
  A web request, proxy request, sign-in or AWS call carried a user agent hard-coded in HexStrike (HexStrike-HTTP-Framework/,
  HexStrike-BrowserAgent/, or Mozilla/5.0 (Compatible Exploit) from its generated exploits), or the <hexstrikeXSSTest123>
  probe its browser agent submits into forms.
  AOF attack detections by ThreatDefence: https://github.com/ThreatDefence/AOF_attack_detections
severity: High
requiredDataConnectors:
  - connectorId: CefAma
    dataTypes: []
  - connectorId: AzureMonitor(IIS)
    dataTypes: []
  - connectorId: AzureActiveDirectory
    dataTypes: []
  - connectorId: AWS
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
  - InitialAccess
relevantTechniques:
  - T1595.002
  - T1190
query: |
  let UAs = dynamic(["HexStrike-HTTP-Framework/", "HexStrike-BrowserAgent/", "Mozilla/5.0 (Compatible Exploit)"]);
  union isfuzzy=true
      (CommonSecurityLog | where RequestClientApplication has_any (UAs) or RequestURL contains "hexstrikeXSSTest123"
          | project TimeGenerated, Src=SourceIP, Target=DestinationHostName, UA=RequestClientApplication, Detail=RequestURL),
      (W3CIISLog | extend UA=replace_string(csUserAgent, "+", " ") | where UA has_any (UAs) or csUriQuery contains "hexstrikeXSSTest123"
          | project TimeGenerated, Src=cIP, Target=csHost, UA, Detail=csUriStem),
      (SigninLogs | where UserAgent has_any (UAs) | project TimeGenerated, Src=IPAddress, Target=AppDisplayName, UA=UserAgent, Detail=UserPrincipalName),
      (AWSCloudTrail | where UserAgent has_any (UAs) | project TimeGenerated, Src=SourceIpAddress, Target=EventSource, UA=UserAgent, Detail=EventName)
  | summarize Events=count(), FirstSeen=min(TimeGenerated), Samples=make_set(Detail, 10) by Src, Target, UA
version: 1.0.0
kind: Scheduled
