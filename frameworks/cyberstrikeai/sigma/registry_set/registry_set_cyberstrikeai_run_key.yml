title: CyberStrikeAI Implant Run Key Value SystemUpdate
id: 5dbb150e-eefe-5b43-96ae-b374d59417f1
status: experimental
description: |
    Detects a Run value named SystemUpdate, which the CyberStrikeAI implant writes under
    HKCU\Software\Microsoft\Windows\CurrentVersion\Run to start at logon.
references:
    - https://github.com/AIPentest/CyberStrikeAI
    - https://securelist.com/cyberstrikeai-attacks/121715/
    - https://github.com/ThreatDefence/AOF_attack_detections
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\CurrentVersion\Run\SystemUpdate'
    condition: selection
falsepositives:
    - Software that really names its Run value SystemUpdate
level: high
