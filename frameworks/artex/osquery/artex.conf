{
  "platform": "all",
  "version": "1.0.0",
  "description": "ARTEX detections by ThreatDefence. https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting",
  "queries": {
    "artex_probe_files_linux_macos": {
      "query": "SELECT path, filename, size, datetime(mtime, 'unixepoch') AS modified FROM file WHERE (path LIKE '/tmp/%' OR path LIKE '/var/tmp/%' OR path LIKE '/var/www/%%' OR path LIKE '/srv/%%' OR path LIKE '/usr/share/nginx/%%' OR path LIKE '/opt/%%') AND (filename LIKE 'artex-probe-%' OR filename LIKE 'artx\\_%' ESCAPE '\\' OR filename IN ('cl1217.jsp','f1219a.jsp','z1219.jsp','zzartx0000.php'));",
      "interval": 3600,
      "platform": "linux,darwin",
      "description": "ARTEX probe files and JSP web shell names in temp and web directories."
    },
    "artex_probe_files_windows": {
      "query": "SELECT path, filename, size, datetime(mtime, 'unixepoch') AS modified FROM file WHERE path LIKE 'C:\\ProgramData\\artx%%' OR path LIKE 'C:\\Windows\\Temp\\artx%' OR path LIKE 'C:\\Windows\\Temp\\artex-probe-%' OR path LIKE 'C:\\inetpub\\wwwroot\\%%\\artex-probe-%';",
      "interval": 3600,
      "platform": "windows",
      "description": "The artx5v working folder from VAPOR PANDA intrusions and ARTEX probe files."
    },
    "artex_probe_accounts": {
      "query": "SELECT uid, username, description, directory FROM users WHERE username LIKE '%ArtexProbe%' OR username LIKE 'artex%' OR username LIKE 'qa\\_probe\\_%' ESCAPE '\\';",
      "interval": 3600,
      "description": "Local accounts named the way ARTEX agents name their test accounts."
    },
    "web_service_child_shells": {
      "query": "SELECT p.pid, p.name, p.cmdline, pp.name AS parent, pp.cmdline AS parent_cmdline FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE pp.name IN ('nginx','httpd','apache2','php-fpm','java','node','mysqld','mariadbd','postgres','w3wp.exe','httpd.exe','java.exe','node.exe','php-cgi.exe','sqlservr.exe') AND p.name IN ('sh','bash','dash','curl','wget','nc','ncat','socat','busybox','cmd.exe','powershell.exe','pwsh.exe','curl.exe','certutil.exe');",
      "interval": 300,
      "description": "Web and database services with a shell or download tool as a child right now."
    },
    "artex_console_listening": {
      "query": "SELECT lp.port, lp.address, p.name, p.path, p.cmdline FROM listening_ports lp JOIN processes p USING (pid) WHERE lp.port IN (8787, 8790, 8890) OR p.path LIKE '%/app/artex' OR p.name = 'artex';",
      "interval": 3600,
      "description": "An ARTEX console listening on this host (default port 8787)."
    },
    "artex_container_images": {
      "query": "SELECT id, tags, created FROM docker_images WHERE tags LIKE '%artex%' OR tags LIKE '%scopeweaver%';",
      "interval": 3600,
      "platform": "linux,darwin",
      "description": "ARTEX container images, including the backdoored tomicdd/artex and congdonglinux/artex."
    },
    "svchost_outside_system32": {
      "query": "SELECT pid, name, path, cmdline FROM processes WHERE lower(name) = 'svchost.exe' AND lower(path) NOT LIKE 'c:\\windows\\system32\\%' AND lower(path) NOT LIKE 'c:\\windows\\syswow64\\%';",
      "interval": 900,
      "platform": "windows",
      "description": "svchost.exe outside the system folder, as in the BLOODALCHEMY side-loading chain."
    }
  }
}
