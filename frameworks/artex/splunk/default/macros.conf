# Point these at your own indexes and sourcetypes. Every saved search uses them.
[artex_cloudtrail]
definition = index=* sourcetype=aws:cloudtrail

[artex_azure_audit]
definition = index=* (sourcetype=azure:aad:audit OR sourcetype=ms:aad:audit OR sourcetype=mscs:azure:eventhub category=AuditLogs)

[artex_azure_activity]
definition = index=* (sourcetype=azure:monitor:activity OR sourcetype=mscs:azure:eventhub category=Administrative)

[artex_keyvault]
definition = index=* (sourcetype=azure:monitor:resource OR sourcetype=mscs:azure:eventhub) category=AuditEvent

[artex_web_raw]
definition = index=* (sourcetype=access_combined OR sourcetype=iis OR sourcetype=nginx:plus:access OR sourcetype=aws:elb:accesslogs OR sourcetype=azure:waf)

[artex_ua_terms]
definition = ("*artex-readonly/*" OR "*artex-pentest/*" OR "*artex-audit/*" OR "*artex-verify/*" OR "*artex-spawn/*" OR "*ARTEX-worker/*" OR "*artex-enrich/*" OR "*artex-i21861-canary*" OR "*ARTeX-authorized-pentest*" OR "*Mozilla/5.0 ARTeX*" OR "*Mozilla/5.0 (ARTEX)*" OR "*ArtExVerify/*" OR "*ArtEx/1.0*" OR "*scopeweaver*" OR "*spa-api-recon*")
