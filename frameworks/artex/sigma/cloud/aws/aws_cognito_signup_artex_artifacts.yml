title: Cognito Sign-Up With ARTEX Artifacts
id: d5e48c3b-e7a2-595f-80f1-5fe5e2602d4f
status: experimental
description: |
    Detects Cognito sign-up attempts that try to set custom:isAdmin or use an artex-<random>.invalid
    tenant domain, as Datadog observed in ARTEX activity.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.privilege-escalation
    - attack.t1078.004
    - attack.persistence
    - attack.t1136.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'cognito-idp.amazonaws.com'
        eventName: 'SignUp'
    selection_artifact:
        - errorMessage|contains:
            - 'custom:isAdmin'
            - 'artex-'
        - requestParameters.userAttributes|contains: 'custom:isAdmin'
    condition: all of selection_*
falsepositives:
    - Applications that genuinely use an isAdmin attribute in sign-up
level: high
