title: BLOODALCHEMY Loader Files Written
id: e9278635-8c4b-52b4-9343-df99a0618f34
status: experimental
description: |
    Detects the GameHook side-loading file names used to load the BLOODALCHEMY backdoor in the VAPOR
    PANDA ARTEX campaign, outside a legitimate game install.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.persistence
    - attack.stealth
    - attack.t1574.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '\\graphics-hook-filter64.dll'
            - '\\graphics-hook_config.bin'
    condition: selection
falsepositives:
    - Legitimate GameHook or OBS installations
level: high
