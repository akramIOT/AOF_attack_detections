title: ARTEX OAuth Callback Probe
id: 8b1108e8-89db-53a6-a4e6-0486b5d4fd7d
status: experimental
description: |
    Detects the fixed invalid code and state values ARTEX sends to OAuth callback routes while mapping
    an application.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.reconnaissance
    - attack.t1595.002
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection:
        cs-uri-query|contains: 'code=AAAA&state=notvalidb64!!'
    condition: selection
falsepositives:
    - Unknown
level: high
