title: ARTEX Placeholder Probe Paths
id: a3f72892-cf08-5127-acdd-8734b1e8a83b
status: experimental
description: |
    Detects the placeholder paths ARTEX agents request to learn how a site answers a missing resource,
    right before a burst of guesses. These names have no legitimate caller.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.reconnaissance
    - attack.t1595.002
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection:
        cs-uri-stem|contains:
            - '/zzz-nonexistent-xyz123'
            - 'zzz_nonexistent_abc.txt'
            - 'Notexist-xyz'
    condition: selection
falsepositives:
    - Unknown
level: high
