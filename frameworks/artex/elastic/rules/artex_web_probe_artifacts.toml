[metadata]
creation_date = "2026/11/20"
maturity = "development"
updated_date = "2026/11/20"

[rule]
author = ["ThreatDefence"]
description = """
Placeholder probe paths, alg none JWTs or the fixed OAuth callback probe that ARTEX sends while mapping a web application.
"""
from = "now-9m"
index = ["logs-*", "filebeat-*"]
language = "kuery"
license = "MIT"
name = "ARTEX Web Probe Artifacts"
references = ["https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting"]
risk_score = 73
rule_id = "44c958d0-1431-59ad-99ec-d09fe85c846d"
severity = "high"
tags = ["Threat: ARTEX", "Data Source: Multiple", "Use Case: Threat Detection"]
type = "query"

query = '''
url.original : (*zzz-nonexistent-xyz123* or *zzz_nonexistent_abc.txt* or *Notexist-xyz* or *eyJhbGciOiJub25lIn0.* or *code=AAAA&state=notvalidb64!!*)
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1595"
name = "Active Scanning"
reference = "https://attack.mitre.org/techniques/T1595/"

[rule.threat.tactic]
id = "TA0043"
name = "Reconnaissance"
reference = "https://attack.mitre.org/tactics/TA0043/"
