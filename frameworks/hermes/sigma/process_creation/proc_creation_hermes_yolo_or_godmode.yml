title: Hermes Agent With Approvals Off or Its Jailbreak Skill
id: 6474a9dc-13b9-5160-8188-742e5eee8231
status: experimental
description: |
    Detects Hermes Agent started with approvals switched off (--yolo, HERMES_YOLO_MODE) and the scripts of its bundled
    godmode jailbreak skill. Attackers ran Hermes this way against Thailand's Ministry of Finance (Hunt.io) and with
    godmode on DeepSeek (Unit 42).
references:
    - https://github.com/NousResearch/hermes-agent
    - https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/
    - https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent
    - https://www.threatdown.com/blog/carbonato/
    - https://github.com/ThreatDefence/AOF_attack_detections
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.execution
    - attack.t1059
    - attack.defense-impairment
logsource:
    category: process_creation
detection:
    selection_hermes:
        CommandLine|re: '(^|[/\\\s])hermes(\.exe)?(\s|$)|hermes_cli|run_agent\.py|/\.hermes/'
    selection_yolo:
        CommandLine|contains:
            - '--yolo'
            - 'HERMES_YOLO_MODE'
    selection_godmode:
        CommandLine|contains:
            - 'load_godmode.py'
            - 'auto_jailbreak.py'
            - 'parseltongue.py'
            - 'godmode_race.py'
    condition: (selection_hermes and selection_yolo) or selection_godmode
falsepositives:
    - Developers running Hermes unattended in a sandbox
    - Red teams testing model guardrails
level: medium
