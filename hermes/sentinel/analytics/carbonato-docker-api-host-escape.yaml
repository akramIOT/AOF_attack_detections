id: 1b9d625d-b91a-5df1-b7b6-9a320eb0541a
name: Carbonato Docker worm host escape or persistence
description: |
  A host ran Carbonato's Docker escape (nsenter -t 1 into the host from a privileged container), its container names
  netns-probe or net-setup, its image system/resolved, or its persistence files (/opt/gh0st/, /usr/local/bin/.docker-network-monitor,
  a miner at /usr/sbin/systemd-logind, /root/.hermes/loot/). Carbonato installs Hermes Agent with a GH0ST persona and runs
  it from Telegram.
  AOF attack detections by ThreatDefence: https://github.com/ThreatDefence/AOF_attack_detections
severity: High
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
  - Persistence
relevantTechniques:
  - T1611
  - T1053.003
  - T1036.005
query: |
  union isfuzzy=true
      (DeviceProcessEvents
          | where (ProcessCommandLine contains "nsenter" and ProcessCommandLine matches regex @"-t\s+1\s" and ProcessCommandLine contains "-m")
              or ProcessCommandLine matches regex @"netns-probe|net-setup|system/resolved|docker-network-monitor|/opt/gh0st/|CARBONATO_API_KEY"
          | project TimeGenerated, DeviceName, Detail=ProcessCommandLine),
      (DeviceFileEvents
          | where FolderPath in~ ("/usr/local/bin/.docker-network-monitor", "/usr/sbin/systemd-logind") or FolderPath startswith "/opt/gh0st/"
              or FolderPath startswith "/root/.hermes/loot/"
          | project TimeGenerated, DeviceName, Detail=strcat(FolderPath, " by ", InitiatingProcessCommandLine))
  | summarize Events=count(), FirstSeen=min(TimeGenerated), Details=make_set(substring(Detail, 0, 300), 10) by DeviceName
version: 1.0.0
kind: Scheduled
