title: Connection to an AI Model API
id: 7660cead-563a-5832-b0fa-e0617a502787
status: experimental
description: |
    One connection to an AI model API or model gateway. This rule is the base event for the failover correlation. On
    its own it is context: developer machines and approved gateways call these APIs all day. Alert on
    proxy_several_model_apis_one_source instead, which requires two or more of these hosts from one source.
references:
    - https://github.com/QwenLM/qwen-code
    - https://github.com/ThreatDefence/AOF_attack_detections
author: AOF
date: 2026-11-21
tags:
    - attack.command-and-control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        cs-host|endswith:
            - 'api.deepseek.com'
            - 'dashscope.aliyuncs.com'
            - 'dashscope-intl.aliyuncs.com'
            - 'dashscope-us.aliyuncs.com'
            - 'open.bigmodel.cn'
            - 'api.z.ai'
            - 'api.moonshot.cn'
            - 'api.moonshot.ai'
            - 'api.kimi.com'
            - 'code.kimi.com'
            - 'api.kimi.ai'
            - 'api.minimax.io'
            - 'api.minimax.cn'
            - 'api.minimaxi.com'
            - 'ark.cn-beijing.volces.com'
            - 'api.siliconflow.cn'
            - 'api.siliconflow.com'
            - 'api.stepfun.com'
            - 'api.stepfun.ai'
            - 'tokenhub.tencentmaas.com'
            - 'api.lkeap.cloud.tencent.com'
            - 'api.hunyuan.cloud.tencent.com'
            - 'qianfan.baidubce.com'
            - 'api.xiaomimimo.com'
            - 'api-inference.modelscope.cn'
            - 'openrouter.ai'
            - 'api.novita.ai'
            - 'zenmux.ai'
            - 'api.ofox.ai'
            - 'api.together.xyz'
            - 'api.groq.com'
            - 'api.tensorx.ai'
            - 'api.openai.com'
            - 'api.anthropic.com'
            - 'generativelanguage.googleapis.com'
            - 'api.mistral.ai'
            - 'api.x.ai'
    condition: selection
falsepositives:
    - Any legitimate client of these model APIs. Do not alert on this rule alone
level: informational
