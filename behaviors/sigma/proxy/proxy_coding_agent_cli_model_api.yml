title: AI Agent Client Calling a Chinese Model API or Model Gateway
id: 74762d35-ef5c-5ea1-8d02-bd4cc43548f6
status: experimental
description: |
    Detects an AI agent client (Qwen Code, Kimi CLI, opencode, Claude Code, Codex, Pi) calling DeepSeek, Qwen on
    Alibaba DashScope, GLM on BigModel or Z.ai, Kimi, MiniMax, Doubao on Volcano Engine, SiliconFlow or a model gateway such
    as OpenRouter. These are the models seen behind agentic attacks (CyberStrikeAI, Cairn). Normal on some developer
    machines; review it from servers, container hosts and build agents. Hunt 02 also covers consoles calling these APIs
    from Go and Python.
references:
    - https://github.com/oritera/Cairn
    - https://norforge.com/blog/inside_cairn
    - https://github.com/QwenLM/qwen-code
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.command-and-control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection_ua:
        c-useragent|startswith:
            - 'QwenCode/'
            - 'KimiCLI/'
            - 'opencode/'
            - 'claude-cli/'
            - 'codex_exec/'
            - 'codex_cli_rs/'
            - 'pi/0.'
    selection_host:
        cs-host|endswith:
            - 'api.deepseek.com'
            - 'dashscope.aliyuncs.com'
            - 'dashscope-intl.aliyuncs.com'
            - 'dashscope-us.aliyuncs.com'
            - 'open.bigmodel.cn'
            - 'api.z.ai'
            - 'api.moonshot.cn'
            - 'api.moonshot.ai'
            - 'api.kimi.com'
            - 'code.kimi.com'
            - 'api.minimax.io'
            - 'api.minimax.cn'
            - 'api.minimaxi.com'
            - 'ark.cn-beijing.volces.com'
            - 'api.siliconflow.cn'
            - 'api.siliconflow.com'
            - 'api.stepfun.com'
            - 'tokenhub.tencentmaas.com'
            - 'qianfan.baidubce.com'
            - 'api.xiaomimimo.com'
            - 'api-inference.modelscope.cn'
            - 'openrouter.ai'
            - 'api.novita.ai'
            - 'zenmux.ai'
    condition: all of selection_*
falsepositives:
    - Developers using AI agents with these model providers
level: medium
